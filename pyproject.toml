[project]
name = "hindi-lexical-sensitivity"
version = "0.1.0"
description = "Reproducible research on Hindi lexical sensitivity"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "openpyxl>=3.1.2",
    "torch>=2.0.0",
    "datasets>=2.0.0,<3.0",
    "captum>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
