[project]
name = "hindi-lexical-sensitivity"
version = "0.1.0"
description = "Reproducible research on Hindi lexical sensitivity"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "datasets>=2.14.0,<3.0.0",
    "captum>=0.7.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "typst>=0.11.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
